name: Pasang Submodule HevSocks5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-hev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Konfigurasi Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bersihkan submodule HEV lama
        run: |
          git submodule deinit -f hev-socks5-tunnel || true
          git rm -rf hev-socks5-tunnel || true
          rm -rf hev-socks5-tunnel || true
          rm -rf .git/modules/hev-socks5-tunnel || true

          if git config -f .gitmodules --get-regexp '^submodule\.hev-socks5-tunnel\.' >/dev/null 2>&1; then
            git config -f .gitmodules --remove-section submodule.hev-socks5-tunnel || true
          fi

      - name: Tambahkan submodule hev-socks5-tunnel
        run: |
          git submodule add \
            https://github.com/unarto/hev-socks5-tunnel.git \
            hev-socks5-tunnel

      - name: Verifikasi submodule
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules

          echo ""
          echo "=== Git submodule status ==="
          git submodule status

          echo ""
          echo "=== Git status ==="
          git status

      - name: Commit perubahan
        run: |
          git add .gitmodules hev-socks5-tunnel

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan yang perlu di-commit."
          else
            git commit -m "🤖 Bot: Pasang submodule hev-socks5-tunnel"
          fi

      - name: Push ke branch main
        run: |
          git push origin HEAD:main